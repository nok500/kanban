# Run the full app (web UI, sync server, agent runner, agent probe, and Postgres)
# built from local source.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d --build
#
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: kanban-server:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://doska:${POSTGRES_PASSWORD:-doska}@db:5432/doska}
      AUTH_LOGIN: ${AUTH_LOGIN:?set AUTH_LOGIN in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      ALWAYS_AUTH: ${ALWAYS_AUTH:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-}
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env, e.g. https://kanban.example.com}
      AGENT_MONITORS: ${AGENT_MONITORS:-VOODOO|http://192.168.8.229:4747/status,VERDUN|http://agent-probe:4747/status}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-http://agent-runner:4850}
    volumes:
      - doska-files:/data/files
    networks:
      default:
        aliases:
          - doska-api
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: kanban-web:local
    ports:
      - "${WEB_HOST_BIND:+${WEB_HOST_BIND}:}${WEB_PORT:-8080}:80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doska}
      POSTGRES_DB: doska
    volumes:
      - doska-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doska -d doska"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent-runner:
    build:
      context: .
      dockerfile: packages/core/agent-runner/Dockerfile
    image: kanban-agent-runner:local
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /home/jvnl
    volumes:
      - ${AGY_BIN}:/usr/local/bin/agy:ro
      - ${CLAUDE_BIN_USR_SHARE}:/usr/local/bin/claude:ro
      - ${GEMINI_BIN}:/home/jvnl/.gemini
      - ${CLAUDE_BIN}:/home/jvnl/.claude
      - ${CLAUDE_JSON}:/home/jvnl/.claude.json
    restart: unless-stopped

  agent-probe:
    build:
      context: .
      dockerfile: packages/core/agent-probe/Dockerfile
    image: kanban-probe:local
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    ports:
      - "${AGENT_PROBE_PORT:-4747}:4747"
    restart: unless-stopped

volumes:
  doska-pgdata:
  doska-files:
