# Run the full app (web UI, sync server, agent runner, agent probe, and Postgres)
# built from local source, side by side with the production stack.
#
# Usage:
#   pnpm local:up      # docker compose -f docker-compose.local.yml up -d --build
#   pnpm local:logs
#   pnpm local:down    # add -v to also drop the local database
#
# Isolation from production:
#   - Own compose project (`kanban-local`), so containers, network and volumes
#     (database, attachments) never touch the production ones.
#   - Host ports start at 5001 (5000 is taken on this host): web UI on
#     LOCAL_WEB_PORT (5001), agent probe on LOCAL_PROBE_PORT (5002).
#     Production keeps WEB_PORT / AGENT_PROBE_PORT.
#   - Works without a .env: the LOCAL_* variables below have dev defaults
#     (sign in as admin / admin at http://verdun:5001). The login is only
#     seeded on the first boot of an empty database: after changing it, run
#     `pnpm local:down -v` to start over.
#
name: kanban-local

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: kanban-server:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://doska:${POSTGRES_PASSWORD:-doska}@db:5432/doska}
      AUTH_LOGIN: ${LOCAL_AUTH_LOGIN:-admin}
      AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD:-admin}
      AUTH_SECRET: ${LOCAL_AUTH_SECRET:-local-dev-secret-not-for-production-use}
      # Other origins you open the local UI from (sign-in rejects unlisted ones).
      AUTH_TRUSTED_ORIGINS: ${LOCAL_AUTH_TRUSTED_ORIGINS:-http://localhost:5001,http://127.0.0.1:5001,http://192.168.8.220:5001}
      ALWAYS_AUTH: ${ALWAYS_AUTH:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-}
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Must match the origin you open in the browser, or sign-in is rejected.
      BASE_URL: ${LOCAL_BASE_URL:-http://verdun:${LOCAL_WEB_PORT:-5001}}
      AGENT_MONITORS: ${AGENT_MONITORS:-VOODOO|http://192.168.8.229:4747/status,VERDUN|http://agent-probe:4747/status}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-http://agent-runner:4850}
      # Card chat: llama.cpp instances as `Name|API URL[|UI URL]`, comma-separated.
      # The API URL is called from inside this container, so the host's
      # localhost is host.docker.internal; LAN IPs work as they are. The UI URL
      # is opened by your browser. Add more instances, e.g.
      # local|http://host.docker.internal:8081/v1|http://localhost:8081/,voodoo|http://192.168.8.229:8081/v1
      LLAMA_ENDPOINTS: ${LOCAL_LLAMA_ENDPOINTS:-local|http://host.docker.internal:8081/v1|http://localhost:8081/}
    volumes:
      - doska-files:/data/files
    networks:
      default:
        aliases:
          - doska-api
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: kanban-web:local
    ports:
      - "${LOCAL_WEB_PORT:-5001}:80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doska}
      POSTGRES_DB: doska
    volumes:
      - doska-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doska -d doska"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent-runner:
    build:
      context: .
      dockerfile: packages/core/agent-runner/Dockerfile
    image: kanban-agent-runner:local
    user: "${UID:-1000}:${GID:-1000}"
    # pi's llama.cpp provider points at the host's localhost:8081; the runner
    # relays its own localhost:8081 there (LOCALHOST_FORWARDS), so the pi config
    # works unchanged inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /home/jvnl
      # `pi` agent tag: provider/model. Empty model: the provider's first one.
      PI_PROVIDER: ${PI_PROVIDER:-llama.cpp}
      PI_MODEL: ${PI_MODEL:-}
      # Comma-separated `localPort:host:port` relays from the container's localhost.
      LOCALHOST_FORWARDS: ${LOCALHOST_FORWARDS:-8081:host.docker.internal:8081}
    volumes:
      - ${AGY_BIN:-${HOME}/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${CLAUDE_BIN_USR_SHARE:-${HOME}/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${GEMINI_BIN:-${HOME}/.gemini}:/home/jvnl/.gemini
      - ${CLAUDE_BIN:-${HOME}/.claude}:/home/jvnl/.claude
      - ${CLAUDE_JSON:-${HOME}/.claude.json}:/home/jvnl/.claude.json
      # pi: the host's install (read-only) and its config (~/.pi: providers, auth).
      - ${PI_PACKAGE:-/usr/local/lib/node_modules/@earendil-works/pi-coding-agent}:/opt/pi:ro
      - ${PI_CONFIG:-${HOME}/.pi}:/home/jvnl/.pi
    restart: unless-stopped

  agent-probe:
    build:
      context: .
      dockerfile: packages/core/agent-probe/Dockerfile
    image: kanban-probe:local
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    ports:
      - "${LOCAL_PROBE_PORT:-5002}:4747"
    restart: unless-stopped

volumes:
  doska-pgdata:
  doska-files:
