services:
  server:
    image: ghcr.io/nok500/kanban-server:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Defaults to the bundled Postgres below; override with your own managed
      # DATABASE_URL to skip it entirely.
      DATABASE_URL: ${DATABASE_URL:-postgres://kanban:${POSTGRES_PASSWORD:-kanban}@db:5432/kanban}
      # Auth credentials come from the env (see .env.selfhost.example).
      AUTH_LOGIN: ${AUTH_LOGIN:?set AUTH_LOGIN in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      # The web UI shows sign in, and does not allow local unauthenticated usage
      ALWAYS_AUTH: ${ALWAYS_AUTH:-true}
      # Optional single sign-on (see the docs on environment variables).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-}
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env, e.g. https://kanban.example.com}
      AGENT_MONITORS: ${AGENT_MONITORS:-VOODOO|http://192.168.8.229:4747/status,VERDUN|http://agent-probe:4747/status}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-http://agent-runner:4850}
      # Card chat: llama.cpp instances as `Name|API URL[|UI URL]`, comma-separated.
      # Optional and read-only in the UI; admins add more under Settings → LLM
      # endpoints (full domains such as https://llama.example.com work there).
      LLAMA_ENDPOINTS: ${LLAMA_ENDPOINTS:-}
    volumes:
      - kanban-files:/data/files
      - ${AGENT_SESSIONS:-${HOME}/.kanban/sessions}:/kanban/sessions
    networks:
      default:
        aliases:
          - kanban-api
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run on boot before the port opens.
      start_period: 40s
    restart: unless-stopped

  web:
    image: ghcr.io/nok500/kanban-web:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${WEB_HOST_BIND:+${WEB_HOST_BIND}:}${WEB_PORT:-8080}:80"
    depends_on:
      - server
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first, nginx is IPv4-only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: kanban
    volumes:
      - kanban-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent-runner:
    image: ghcr.io/nok500/kanban-agent-runner:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /home/jvnl
      # `pi` agent tag: OpenAI-compatible servers (llama.cpp, ...) tried in
      # order; the first that answers runs the job. A JSON object of
      # name -> URL ({"pc1": "192.168.8.229:8080/v1"}), a JSON list or
      # comma-separated URLs; `URL|api-key` for a server with a key. These
      # are called from inside the container: LAN IPs work as they are, and
      # localhost is the container itself.
      LOCAL_PROVIDERS: '${LOCAL_PROVIDERS:-}'
      # Model to ask for. Empty: a model the server already has loaded, else its
      # first chat model.
      PI_MODEL: ${PI_MODEL:-}
      # Without LOCAL_PROVIDERS, pi runs on its own config (~/.pi below) and
      # PI_PROVIDER picks one of its providers.
      PI_PROVIDER: ${PI_PROVIDER:-}
      # pi's tools: web search (and fetch) from the host pi's extensions
      # (~/.pi/agent/settings.json packages). AGENT_SEARXNG_URL: the SearXNG
      # pi-searxng-search queries, as reached from inside the container (its own
      # name, so a SEARXNG_URL exported for the host's pi doesn't leak in).
      PI_TOOLS: ${PI_TOOLS:-web_search,web_fetch,batch_web_fetch}
      SEARXNG_URL: ${AGENT_SEARXNG_URL:-}
    volumes:
      - ${AGY_BIN}:/usr/local/bin/agy:ro
      - ${CLAUDE_BIN_USR_SHARE}:/usr/local/bin/claude:ro
      - ${GEMINI_BIN}:/home/jvnl/.gemini
      - ${CLAUDE_BIN}:/home/jvnl/.claude
      - ${CLAUDE_JSON}:/home/jvnl/.claude.json
      # pi: the host's install (read-only) and its config (~/.pi: providers, auth).
      # opencode: shown in the sidebar for now; jobs don't use it yet.
      - ${OPENCODE_BIN:-${HOME}/.opencode/bin/opencode}:/usr/local/bin/opencode:ro
      - ${PI_PACKAGE:-/usr/local/lib/node_modules/@earendil-works/pi-coding-agent}:/opt/pi:ro
      - ${PI_CONFIG:-${HOME}/.pi}:/home/jvnl/.pi
      # Saved agent sessions and card chats (pi/, claude/, agy/, llama/), shared
      # by the server and the runner. Create the folder first: Docker would make
      # it root-owned, and the runner (UID above) couldn't write to it.
      - ${AGENT_SESSIONS:-${HOME}/.kanban/sessions}:/kanban/sessions
    restart: unless-stopped

  agent-probe:
    image: ghcr.io/nok500/kanban-probe:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    ports:
      - "${AGENT_PROBE_PORT:-4747}:4747"
    restart: unless-stopped

volumes:
  kanban-pgdata:
  kanban-files:
  caddy-data:
  caddy-config:
