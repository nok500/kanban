# Run the full app (web UI + sync server) from your GHCR images.
#
# Postgres is bundled by default (data lives in the doska-pgdata volume).
# To use your own managed Postgres, set DATABASE_URL in .env
#
services:
  server:
    image: ghcr.io/nok500/kanban-server:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Defaults to the bundled Postgres below; override with your own managed
      # DATABASE_URL to skip it entirely.
      DATABASE_URL: ${DATABASE_URL:-postgres://doska:${POSTGRES_PASSWORD:-doska}@db:5432/doska}
      # Auth credentials come from the env (see .env.selfhost.example).
      AUTH_LOGIN: ${AUTH_LOGIN:?set AUTH_LOGIN in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      # The web UI shows sign in, and does not allow local unauthenticated usage
      ALWAYS_AUTH: ${ALWAYS_AUTH:-true}
      # Optional single sign-on (see the docs on environment variables).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-}
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env, e.g. https://doska.example.com}
      AGENT_MONITORS: ${AGENT_MONITORS:-VOODOO|http://192.168.8.229:4747/status,VERDUN|http://agent-probe:4747/status}
      AGENT_RUNNER_URL: ${AGENT_RUNNER_URL:-http://agent-runner:4850}
    volumes:
      - doska-files:/data/files
    networks:
      default:
        aliases:
          - doska-api
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run on boot before the port opens.
      start_period: 40s
    restart: unless-stopped

  web:
    image: ghcr.io/nok500/kanban-web:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${WEB_HOST_BIND:+${WEB_HOST_BIND}:}${WEB_PORT:-8080}:80"
    depends_on:
      - server
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first, nginx is IPv4-only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Remove this service (and the server's depends_on above)
  # if you point DATABASE_URL at your own managed database.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doska}
      POSTGRES_DB: doska
    volumes:
      - doska-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doska -d doska"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent-runner:
    image: ghcr.io/nok500/kanban-agent-runner:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /home/jvnl
    volumes:
      - ${AGY_BIN}:/usr/local/bin/agy:ro
      - ${CLAUDE_BIN_USR_SHARE}:/usr/local/bin/claude:ro
      - ${GEMINI_BIN}:/home/jvnl/.gemini
      - ${CLAUDE_BIN}:/home/jvnl/.claude
      - ${CLAUDE_JSON}:/home/jvnl/.claude.json
    restart: unless-stopped

  agent-probe:
    image: ghcr.io/nok500/kanban-probe:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    ports:
      - "${AGENT_PROBE_PORT:-4747}:4747"
    restart: unless-stopped

volumes:
  doska-pgdata:
  doska-files:
  caddy-data:
  caddy-config:
