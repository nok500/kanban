services:
  agent-probe:
    image: ghcr.io/nok500/doska-agent-probe:${DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: kanban-agent-probe
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    ports:
      - "${AGENT_PROBE_PORT:-4747}:4747"
    restart: unless-stopped
